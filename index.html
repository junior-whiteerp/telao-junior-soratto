<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telão Junior &amp; Soratto</title>
<style>
  /* Layout: nothing but the video, edge to edge on black; a hint and a status line appear only when needed */
  :root {
    --stage: #000000;
    --chip: rgba(13, 16, 24, .88);
    --line: #262c3d;
    --ink: #eef1f7;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--stage); }
  body.idle { cursor: none; }
  .chip { position: fixed; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--chip); border: 1px solid var(--line); font-size: 15px; text-align: center; transition: opacity .4s; z-index: 2; }
  #hint { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  #status { top: calc(16px + env(safe-area-inset-top, 0px)); }
  .chip.off { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>
</head>
<body>

<video id="v" muted playsinline autoplay></video>
<div id="hint" class="chip">Clique na tela para tela cheia</div>
<div id="status" class="chip off" role="status" aria-live="polite"></div>

<script>
(function () {
  var BASE = "m/fixa/", PARTS = 49, AHEAD = 30, KEEP = 20;
  var MIMES = ['video/mp4; codecs="avc1.640029"', 'video/mp4; codecs="avc1.64002A"', 'video/mp4; codecs="avc1.640028"'];
  var v = document.getElementById("v"), hint = document.getElementById("hint"), status = document.getElementById("status");
  var cache = {}, sb = null, part = 0, lock = null, idleT = null, failures = 0;

  function say(t) { status.textContent = t; status.classList.toggle("off", !t); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function name(i) { return i < 0 ? "init.mp4" : "s" + String(i).padStart(3, "0") + ".mp4"; }

  async function get(i) {
    var key = name(i);
    if (cache[key]) return cache[key];
    for (;;) {
      try {
        var r = await fetch(BASE + key);
        if (!r.ok) throw new Error("HTTP " + r.status);
        var buf = await r.arrayBuffer();
        cache[key] = buf; failures = 0; say("");
        return buf;
      } catch (e) {
        failures++;
        if (failures >= 3) say("Sem conexão para carregar o vídeo. Tentando de novo…");
        await sleep(2000);
      }
    }
  }

  function waitIdle() {
    return new Promise(function (r) { if (!sb.updating) r(); else sb.addEventListener("updateend", function f() { sb.removeEventListener("updateend", f); r(); }); });
  }
  async function append(buf) {
    for (;;) {
      await waitIdle();
      try { sb.appendBuffer(buf); await waitIdle(); return; }
      catch (e) {
        if (e.name === "QuotaExceededError") { await trim(5); await sleep(500); }
        else throw e;
      }
    }
  }
  async function trim(keep) {
    var b = sb.buffered;
    if (!b.length) return;
    var cut = v.currentTime - keep;
    if (cut > b.start(0) + 1) { await waitIdle(); sb.remove(b.start(0), cut); await waitIdle(); }
  }
  function ahead() {
    var b = sb.buffered;
    for (var i = 0; i < b.length; i++) if (b.start(i) <= v.currentTime + 0.5 && b.end(i) >= v.currentTime) return b.end(i) - v.currentTime;
    return b.length ? b.end(b.length - 1) - v.currentTime : 0;
  }

  function play() { var p = v.play(); if (p && p.catch) p.catch(function () { say("Clique na tela para começar o vídeo."); }); }

  async function run() {
    var mime = MIMES.filter(function (m) { return window.MediaSource && MediaSource.isTypeSupported(m); })[0];
    if (!mime) { simple(); return; }          // iPhone/iPad (Safari engine, also Chrome there): one looping file instead
    var ms = new MediaSource();
    v.src = URL.createObjectURL(ms);
    await new Promise(function (r) { ms.addEventListener("sourceopen", r, { once: true }); });
    sb = ms.addSourceBuffer(mime);
    sb.mode = "sequence";                      // every part lands right after the previous one, so the loop never restarts
    await append(await get(-1));
    var started = false;
    for (;;) {
      if (ahead() < AHEAD) {
        await append(await get(part));
        part = (part + 1) % PARTS;
        if (!started && ahead() > 2) { started = true; play(); }
      } else {
        await sleep(500);
      }
      if (v.currentTime > KEEP + 10) await trim(KEEP);
      if (started && v.paused && !v.ended && ahead() > 1 && !userPaused) play();
    }
  }

  var usingSimple = false;
  function simple() {
    usingSimple = true; say("");
    v.loop = true; v.preload = "auto"; v.src = "telao.mp4";
    v.addEventListener("error", function () { say("Não consegui carregar o vídeo. Confira a internet e recarregue a página."); });
    v.addEventListener("ended", function () { v.currentTime = 0; play(); });
    play();
  }

  var userPaused = false;
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFs() {
    var el = document.documentElement;
    if (!isFs()) {
      var f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f) { var r = f.call(el); if (r && r.catch) r.catch(function () {}); }
    } else {
      var x = document.exitFullscreen || document.webkitExitFullscreen; if (x) x.call(document);
    }
    if (v.paused && !userPaused) play();
  }
  function wake() {
    if (!("wakeLock" in navigator) || lock) return;
    navigator.wakeLock.request("screen").then(function (l) { lock = l; l.addEventListener("release", function () { lock = null; }); }).catch(function () {});
  }
  function poke() {
    document.body.classList.remove("idle"); clearTimeout(idleT);
    idleT = setTimeout(function () { document.body.classList.add("idle"); }, 2000);
  }

  document.addEventListener("click", function () { if (v.paused && !userPaused) play(); toggleFs(); wake(); poke(); hint.classList.add("off"); });
  document.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "f") toggleFs();
    else if (k === " ") { e.preventDefault(); if (v.paused) { userPaused = false; play(); } else { userPaused = true; v.pause(); } }
  });
  ["mousemove", "mousedown", "touchstart"].forEach(function (e) { document.addEventListener(e, poke, { passive: true }); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { wake(); if (v.paused && !userPaused) play(); } });

  setTimeout(function () { hint.classList.add("off"); }, 6000);
  poke(); wake();
  run().catch(function () { if (!usingSimple) { try { v.removeAttribute("src"); v.load(); } catch (e) {} simple(); } });
})();
</script>
</body>
</html>
